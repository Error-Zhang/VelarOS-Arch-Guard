name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing 走 OIDC 换短时凭据，要 npm >= 11.5.1；node 22 自带的是 10.x。
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      # 不传 NODE_AUTH_TOKEN：发布凭据由 npm 用本 workflow 的 OIDC 身份换取（见 permissions.id-token）。
      # 长期 token 不再用——npm 正在限缩绕过 2FA 的 token（账号侧 2026-08 / 直接发布 2027-01），
      # 且它自己在建 token 的页面上就把 CI 场景指向 Trusted Publishing。provenance 同源于这套 OIDC。
      - run: npm publish --access public --provenance
